name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy==2.1.3 pandas==2.2.3 pytest==8.3.4
      - run: pytest -q
      - run: python run_demo.py --no-plots
